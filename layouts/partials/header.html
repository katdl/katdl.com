<header class="site-header">
  <div class="container">
    <a href="/" class="logo">
      <img src="/images/site-icons/katdl-logo-square.png" alt="{{ .Site.Title }}" width="40" height="40">
      <span>KAT<span class="logo-accent">DL</span></span>
    </a>
    <button class="nav-toggle" aria-label="Toggle navigation" onclick="document.querySelector('.main-nav').classList.toggle('open')">&#9776;</button>
    <nav class="main-nav">
      {{ range .Site.Menus.main }}
      <a href="{{ .URL }}" {{ if $.IsMenuCurrent "main" . }}class="active"{{ end }}>{{ .Name }}</a>
      {{ end }}
    </nav>
  </div>
</header>
