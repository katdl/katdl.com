<footer class="site-footer">
  <div class="container">
    <div class="footer-content">
      <div>
        <div class="footer-brand">KATDL</div>
        <p class="footer-tagline">AI consulting for health sciences</p>
      </div>
      <div class="footer-links">
        {{ range .Site.Menus.footer }}
        <a href="{{ .URL }}">{{ .Name }}</a>
        {{ end }}
      </div>
      <div class="footer-social">
        <a href="https://github.com/katdl" target="_blank" rel="noopener">GitHub</a>
        <a href="https://twitter.com/kat_data_labs" target="_blank" rel="noopener">Twitter</a>
      </div>
    </div>
    <p class="copyright">&copy; {{ now.Year }} {{ .Site.Title }}. All rights reserved.</p>
  </div>
</footer>
