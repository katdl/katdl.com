# Site parameters for KATDL

# Appearance
defaultAppearance = "dark"

# Site description and metadata
description = "KATDL — AI consulting and software engineering for health sciences"
author = "Matt Konda"

# Header settings
[header]
  logo = "/images/site-icons/katdl-logo-square.png"

# Favicon
# favicon = "/favicon.png"

# Social links
[social]
  twitter = "kat_data_labs"
  github = "katdl"
  email = "info@katdl.com"

# Homepage settings
[homepage]
  layout = "custom"
  showRecent = true
  recentLimit = 5

# Article settings
[article]
  showDate = true
  showAuthor = true
  showReadingTime = true
  showTableOfContents = true
  showTaxonomies = true
  showWordCount = false
  sharingLinks = ["twitter", "linkedin", "email"]

# List page settings
[list]
  showTableOfContents = false
  showSummary = true
  showCards = true
  groupByYear = true

# Taxonomy settings
[taxonomy]
  showTermCount = true
